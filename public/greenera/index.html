<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greenera prototype</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<body>
<!--
  Greenera, a clickable prototype of the v3 screens (Figma page "Greenera · Screens v3 (M3)").

  Every screen is built live, in the layout of the Figma frames, so every control
  works: the scan card rises, fills and expands for whichever product is scanned;
  the product pages, the score breakdown and the ingredient breakdown are rendered
  by app.js from its PRODUCTS data. Only the status bar and top bar backgrounds are
  2x exports, kept under the live search bar and buttons.
  Every coordinate below is in the 393 x 852 Figma frame.

  ?frame=0       no device frame, the screen at 393 x 852 (for recording)
  ?demo=hero     plays the scan, rise and expand on a loop (for the hero clip)
-->
<main class="room">
  <div class="device" id="device">
    <div class="stage" id="stage">

      <!-- Scan -->
      <section class="screen is-current" id="scan" aria-label="Scan">
        <img class="screen-bg" id="scanBg" src="assets/camera.jpg" alt="Camera view of a Calma cleanser bottle inside the scan frame" width="393" height="852">
        <div class="photo-bg" id="photoBg" hidden></div>
        <div class="flash" id="flash"></div>
        <!-- Dims the camera under the card so the glass reads against it -->
        <div class="scrim" id="scrim"></div>
        <button class="hot" id="shutter" style="left:154px;top:704px;width:85px;height:85px;border-radius:50%" aria-label="Scan the product"></button>
        <button class="hot" id="close" style="left:12px;top:71px;width:40px;height:40px;border-radius:50%" aria-label="Close the result"></button>
        <button class="cam-btn" id="flashBtn" style="left:47px;top:723px" aria-label="Flash" aria-pressed="false"></button>
        <button class="cam-btn" id="photosBtn" style="left:300px;top:723px" aria-label="Scan a photo from your library"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="15" height="15" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.5" cy="7.5" r="1.6" fill="currentColor"/><path d="M3 15l4.5-4.5 3 3 2.5-2.5 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>

        <div class="sheet" id="sheet" aria-live="polite">
          <div class="glass">
            <div class="handle" aria-hidden="true"><span></span></div>
            <div class="sheet-body">
              <div class="score-head">
                <svg class="ring" viewBox="0 0 76 76" width="75" height="77" aria-hidden="true">
                  <circle cx="38" cy="38" r="30" class="ring-track"/>
                  <circle cx="38" cy="38" r="30" class="ring-fill" id="ringFill"/>
                  <circle cx="38" cy="38" r="37.4" class="ring-edge"/>
                  <circle cx="38" cy="38" r="22.6" class="ring-edge"/>
                </svg>
                <span class="ring-num"><span id="ringNum">60</span>%</span>
                <div class="score-copy">
                  <div class="score-title">
                    <span class="t-title">Verified Score</span>
                    <span class="t-tag">(AI-Generated)</span>
                    <button class="toggle" id="toggle" aria-expanded="false"><span id="toggleLabel">Expand</span><svg width="5" height="8" viewBox="0 0 5 8" aria-hidden="true"><path d="M1 1l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                  </div>
                  <p class="verdict" id="verdict"><b>Mixed:</b> gentle on sensitive skin, little sourcing data disclosed.</p>
                </div>
              </div>

              <div class="more" id="more">
                <div class="more-inner">
                  <div class="tiles" id="tiles"></div>
                  <button class="row pick" id="toPick" aria-label="Open the better pick">
                    <span class="thumb-slot" id="pickThumb"></span>
                    <span class="row-text">
                      <span class="pick-line"><span class="t-small">Better pick</span><span class="pill" id="pickPill">78%</span></span>
                      <span class="t-name" id="pickName">Fern Daily Gel Cleanser</span>
                    </span>
                    <span class="row-end"><span class="t-price-sm" id="pickPrice">$14.99</span><span class="t-link">details <svg width="5" height="8" viewBox="0 0 5 8" aria-hidden="true"><path d="M1 1l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
                  </button>
                </div>
              </div>
            </div>

            <button class="row product" id="toProduct" aria-label="Open the product page">
              <span class="thumb-slot" id="prodThumb"></span>
              <span class="row-text">
                <span class="t-name t-wrap" id="prodName">Calma Gentle Foaming Cleanser</span>
                <span class="t-sub"><span id="prodSize">13.52 fl oz</span> <span class="t-faint" id="prodSub">Oil-Free Cleanser for Sensitive Skin</span></span>
              </span>
              <span class="row-end"><span class="t-price" id="prodPrice">$19.99</span><span class="t-link">details <svg width="5" height="8" viewBox="0 0 5 8" aria-hidden="true"><path d="M1 1l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
            </button>
          </div>
        </div>
      </section>

      <!-- The product pages (#product for Calma, #pdp-<key> for the rest) and the score
           breakdown (#breakdown) are built by app.js. -->

      <!-- Ingredient breakdown: built live, so the bottle can fill, move and answer the list.
           app.js renders the rows, the bottle's 15 sections and the detail sheet from INGREDIENTS. -->
      <section class="screen scroller" id="ingredients" aria-label="Ingredient breakdown">
        <!-- Fixed: the title, the bottle and the AI note. Only the list scrolls. -->
        <div class="ing-top">
          <h2 class="ing-title">Ingredient Breakdown</h2>
          <p class="ing-product" id="ingProduct"></p>
          <!-- The counts are the key: one line, not a sentence and a legend -->
          <p class="ing-legend"><span><i style="background:var(--green-300)"></i><b id="ingGood"></b> no known concerns</span><span><i style="background:var(--yellow-300)"></i><b id="ingCare"></b> use with care</span></p>
          <p class="ing-banner" id="ingBanner" role="status" hidden></p>
        </div>
        <div class="ing-body">
          <div class="rail" id="rail">
            <!-- The bottle as the Figma ingredient screen draws it: a 192.7 x 589 bottle, 82px of it
                 off the left edge, one band per ingredient inside its outline. -->
            <button class="bottle" id="bottle" aria-label="The formula as a bottle, one band per ingredient">
              <svg viewBox="0 0 192.7 589" width="192.7" height="589" aria-hidden="true">

<!-- The book's last spread, blank.

     Pages 5 and 6 carried "How I See Things" and its three gradient cards.
     Those cards were the same three placeholders the Organised page shows,
     and the writing they stand for has not been written, so the book was
     ending on a promise of content rather than on content.

     Only the covers and the paper are left: the same four fills and four
     outlines every other spread is built on, lifted from spread-1 so the
     paper edge, the 36px corner radius and the 2px cover rule all match
     exactly. Nothing here is new geometry.

     Putting the pages back means replacing this file with the export, and
     restoring PHOTOS[2] in AboutBook.tsx. -->

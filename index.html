<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- Tab icon: the egg chair, framed on the chair with its rope running
         off the top. It follows the browser's own light/dark theme — the tab
         strip it sits on — not the site's lamp switch: the dark chair on a
         light tab bar, the light chair on a dark one. -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <script>
      try {
        var mq = matchMedia("(prefers-color-scheme: dark)");
        var setIcon = function () {
          document.getElementById("favicon").href = mq.matches ? "/favicon-dark.svg" : "/favicon-light.svg";
        };
        setIcon();
        mq.addEventListener("change", setIcon);
      } catch (e) {}
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
